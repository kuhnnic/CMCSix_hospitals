<!doctype html>

<style>
:root{--bg:#eef4f3;--panel:#fffffff2;--text:#10201d;--muted:#60716e;--line:#0f766e28;--brand:#0f766e;--soft:#dff3ef;color-scheme:light dark;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}@media(prefers-color-scheme:dark){:root{--bg:#071311;--panel:#10201df2;--text:#eef8f6;--muted:#9fb5b0;--line:#94d2bd30;--soft:#125e5948}}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,var(--soft),transparent 34rem),var(--bg);color:var(--text)}button,input,select{font:inherit;border:1px solid var(--line);border-radius:14px}select,input{width:100%;padding:.75rem;background:var(--panel);color:var(--text)}button{cursor:pointer;background:var(--panel);color:var(--text);padding:.65rem .85rem}.wrap{width:min(1450px,calc(100% - 32px));margin:auto;padding:28px 0 46px}.panel,.metric,.bed{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:0 24px 70px #0d3f3a1f}.hero{display:flex;justify-content:space-between;gap:22px;align-items:center;padding:clamp(24px,4vw,44px);margin-bottom:24px}.kicker{color:var(--brand);font-weight:850;letter-spacing:.12em;text-transform:uppercase;font-size:.76rem;margin:0 0 .45rem}h1{font-size:clamp(2rem,5vw,4.5rem);line-height:.95;margin:0 0 1rem;letter-spacing:-.06em}h2,h3{margin:0}.muted,.hero p:last-child{color:var(--muted)}.hero-card{min-width:170px;padding:22px;border-radius:22px;background:linear-gradient(145deg,var(--brand),#115e59);color:white}.hero-card strong{display:block;font-size:3rem}.layout{display:grid;grid-template-columns:350px 1fr;gap:24px;align-items:start}aside{position:sticky;top:18px;padding:20px}.field{display:grid;gap:.45rem;color:var(--muted);font-weight:750;font-size:.88rem}.meta{display:grid;gap:.25rem;margin:14px 0 22px;padding:14px;border-radius:18px;background:var(--soft);color:var(--muted);font-size:.9rem}.meta strong{color:var(--text)}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 12px}.chips,.filters,.overview,.form{display:grid;gap:10px}.chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:16px}.chip span{flex:1;font-weight:800}.chip em{color:var(--muted);font-style:normal}.filters{margin-top:18px}.work{display:grid;gap:20px}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.metric{padding:18px}.metric span,.metric small{display:block;color:var(--muted)}.metric strong{display:block;font-size:clamp(1.7rem,4vw,2.5rem);margin:.2rem 0}.split{display:grid;grid-template-columns:1fr 310px;gap:22px;padding:20px}.pill,.flag{border-radius:999px;background:var(--soft);color:var(--brand);font-weight:850}.pill{padding:.5rem .7rem;font-size:.82rem}.row{display:grid;grid-template-columns:auto 1fr auto minmax(90px,180px);gap:10px;align-items:center;text-align:left;padding:12px}.bar{height:8px;border-radius:999px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--brand)}.dot{width:11px;height:11px;border-radius:50%}.free{background:#10b981;color:#052e22}.reserved{background:#f59e0b;color:#3b2100}.occupied{background:#ef4444;color:white}.cleaning{background:#38bdf8;color:#082f49}.blocked{background:#64748b;color:white}.form{padding:16px;border-radius:22px;background:var(--soft)}.primary{background:var(--brand);color:white;border-color:transparent;font-weight:850}.danger{color:#ef4444}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.bed{display:grid;gap:14px;padding:18px}.head{display:flex;justify-content:space-between;gap:12px}.eyebrow{color:var(--brand);font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;font-weight:850}.badge{padding:.42rem .62rem;border-radius:999px;font-size:.78rem;font-weight:850;white-space:nowrap}dl{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0}dt{color:var(--muted);font-size:.74rem}dd{margin:2px 0 0;font-weight:800;overflow-wrap:anywhere}.flags{display:flex;flex-wrap:wrap;gap:7px}.flag{padding:.36rem .55rem;color:var(--muted);font-size:.78rem}.empty{grid-column:1/-1;text-align:center;padding:44px;border-radius:24px;border:1px dashed var(--line);color:var(--muted)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,18px);opacity:0;pointer-events:none;padding:.85rem 1rem;background:var(--text);color:var(--bg);border-radius:999px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:1100px){.layout,.split{grid-template-columns:1fr}aside{position:static}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:720px){.wrap{width:calc(100% - 18px);padding-top:10px}.hero{flex-direction:column;align-items:stretch}.metrics,.grid{grid-template-columns:1fr}dl{grid-template-columns:1fr}.row{grid-template-columns:auto 1fr auto}.row .bar{grid-column:1/-1}}

<body>
<main class="wrap">
<section class="hero panel"><div><p class="kicker">CMCSix Hospitals</p><h1>Spitalbettenverwaltung</h1><p>Spital auswählen, vorhandene Fachgebiete filtern und Bettenstatus manuell pflegen.</p></div><div class="hero-card"><span>SASIS-Stammdaten</span><strong>16</strong><small>Spitalstandorte geladen</small></div></section>
<section class="layout"><aside class="panel"><label class="field">Spital<select id="hospital"></select></label><div id="meta" class="meta"></div><div class="title"><h2>Fachgebiete</h2><div><button id="all" type="button">Alle</button> <button id="none" type="button">Leeren</button></div></div><div id="specs" class="chips"></div><div class="filters"><label class="field">Status<select id="status"></select></label><label class="field">Eigenschaft<select id="prop"><option value="all">Alle Eigenschaften</option><option value="oxygen">Sauerstoff</option><option value="monitoring">Monitoring</option><option value="isolation">Isolation</option><option value="accessible">Barrierefrei</option></select></label><label class="field">Suche<input id="search" type="search" placeholder="Zimmer, Station, Typ …"></label></div></aside><section class="work"><section id="metrics" class="metrics"></section><section class="split panel"><div><div class="title"><div><p class="kicker">Statussteuerung</p><h2>Bettenübersicht</h2></div><span id="ctx" class="pill"></span></div><div id="overview" class="overview"></div></div><form id="form" class="form"><h2>Bett ergänzen</h2><label class="field">Fachgebiet<select id="newSpec"></select></label><label class="field">Bettentyp<select id="newType"><option>Standardbett</option><option>Überwachungsbett</option><option>Isolationsbett</option><option>Kurzliegerbett</option><option>Barrierefreies Bett</option></select></label><label class="field">Zimmer<input id="newRoom" placeholder="z.B. 204"></label><label class="field">Notiz<input id="newNote" placeholder="optional"></label><button class="primary">Bett anlegen</button><button id="reset" class="danger" type="button">Spital zurücksetzen</button></form></section><section id="beds" class="grid" aria-live="polite"></section></section></section>
</main><div id="toast" class="toast"></div>
<script>
const H=[['luks-luzern','LUKS Spitalbetriebe AG','Kantonsspital 37, 6004 Luzern','Zentrumsversorgung, Niveau 2','X067503'],['luks-sursee','LUKS Spitalbetriebe AG','Spitalstrasse 16A, 6210 Sursee','Zentrumsversorgung, Niveau 2','A626203'],['luks-wolhusen','LUKS Spitalbetriebe AG','Spitalstrasse 50, 6110 Wolhusen','Zentrumsversorgung, Niveau 2','A623603'],['luks-ks37','LUKS Spitalbetriebe AG','Kantonsspital 37, 6004 Luzern','Zentrumsversorgung, Niveau 2','A621003'],['st-anna','Klinik St. Anna','St. Anna-Strasse 32, 6006 Luzern','Zentrumsversorgung, Niveau 2','O709403'],['sonnmatt','Zurzach Care Rehaklinik Sonnmatt Luzern','Sonnmatt 1, 6006 Luzern','Rehabilitationskliniken','J167703'],['ks-aarau','Kantonsspital Aarau AG','Tellstrasse, 5001 Aarau','Zentrumsversorgung, Niveau 2','M700419'],['ks-obwalden','Kantonsspital Obwalden','Brünigstrasse 181, 6060 Sarnen','Grundversorgung, Niveau 3','B708006'],['lups-sarnen','Luzerner Psychiatrie AG','Brünigstrasse 183, 6060 Sarnen','Psychiatrische Kliniken, Niveau 1','K012606'],['spital-nidwalden','Spital Nidwalden','Ennetmooserstrasse 19, 6370 Stans','Grundversorgung, Niveau 4','G709007'],['forensik','Forensische Psychiatrie','Seeblickstrasse 3, 8596 Münsterlingen','Psychiatrische Kliniken, Niveau 1','I551820'],['kjpd','Kinder- und Jugendpsychiatrischer Dienst - KJPD','Seeblickstrasse 3, 8596 Münsterlingen','Psychiatrische Kliniken, Niveau 1','N777320'],['ksk','Klinik St. Katharinental (KSK)','St. Katharinental 7, 8253 Diessenhofen','Rehabilitationskliniken','A703720'],['pk-muensterlingen','Psychiatrische Klinik Münsterlingen','Seeblickstrasse 3, 8596 Münsterlingen','Psychiatrische Kliniken, Niveau 1','A714420'],['stg-frauenfeld','Spital Thurgau AG','Pfaffenholzstrasse 4, 8500 Frauenfeld','Zentrumsversorgung, Niveau 2','P706820'],['stg-muensterlingen','Spital Thurgau AG','Spitalcampus 1, 8596 Münsterlingen','Zentrumsversorgung, Niveau 2','X714320']].map(x=>({id:x[0],name:x[1],addr:x[2],cat:x[3],zsr:x[4],specs:x[3].includes('Psych const S=[['free','Frei','sofort verfügbar'],['reserved','Reserviert','vorgemerkt'],['occupied','Belegt','Patient:in im Bett'],['cleaning','Reinigung','in Aufbereitung'],['blocked','Gesperrt','nicht nutzbar']],K='cmcsix.beds.v1',T=['Standardbett','Überwachungsbett','Isolationsbett','Kurzliegerbett','Barrierefreies Bett'];let st={hid:H[0].id,specs:[],status:'all',prop:'all',q:'',db:JSON.parse(localStorage.getItem(K)||'{}')};const $=q=>document.querySelector(q),e={h:$('#hospital'),m:$('#meta'),s:$('#specs'),a:$('#all'),n:$('#none'),sf:$('#status'),p:$('#prop'),q:$('#search'),met:$('#metrics'),o:$('#overview'),b:$('#beds'),ctx:$('#ctx'),f:$('#form'),ns:$('#newSpec'),nr:$('#newRoom'),nt:$('#newType'),nn:$('#newNote'),r:$('#reset'),t:$('#toast')};function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function slug(x){return x.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-')}function save(){localStorage.setItem(K,JSON.stringify(st.db))}function h(){return H.find(x=>x.id===st.hid)||H[0]}function gen(x){let a=[];x.specs.forEach((sp,j)=>{for(let i=1;i<=8+(j%3);i++){let typ=T[(i+j)%T.length],room=`${j+1}${String(i).padStart(2,'0')}`;a.push({id:`${x.id}-${slug(sp)}-${room}`,specialty:sp,station:`${sp.split(' ')[0]} ${'ABCD'[(i+j)%4]}`,room,bed:i%2?'A':'B',type:typ,care:i%4?'Normalpflege':'Überwachung',isolation:typ==='Isolationsbett'||i%11===0,oxygen:i%3===0,monitoring:typ==='Überwachungsbett',accessible:typ==='Barrierefreies Bett',status:['free','free','occupied','reserved','cleaning','blocked','free','occupied'][(i+j)%8],notes:''})}});return a}function beds(){let x=h();if(!st.db[x.id]){st.db[x.id]=gen(x);save()}return st.db[x.id]}function setBeds(x){st.db[st.hid]=x;save()}function toast(x){e.t.textContent=x;e.t.classList.add('show');clearTimeout(toast.id);toast.id=setTimeout(()=>e.t.classList.remove('show'),2200)}function init(){e.h.innerHTML=H.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.addr)}</option>`).join('');e.sf.innerHTML='<option value="all">Alle Status</option>'+S.map(x=>`<option value="${x[0]}">${x[1]}</option>`).join('');e.h.onchange=x=>select(x.target.value);e.a.onclick=()=>{st.specs=[...h().specs];render()};e.n.onclick=()=>{st.specs=[];render()};e.sf.onchange=x=>{st.status=x.target.value;renderBeds()};e.p.onchange=x=>{st.prop=x.target.value;renderBeds()};e.q.oninput=x=>{st.q=x.target.value.trim().toLowerCase();renderBeds()};e.f.onsubmit=add;e.r.onclick=reset;select(st.hid)}function select(id){st.hid=id;e.h.value=id;st.specs=h().specs.slice(0,3);st.status=st.prop='all';st.q='';e.sf.value=e.p.value='all';e.q.value='';beds();render()}function render(){let x=h();e.m.innerHTML=`<strong>${esc(x.name)}</strong><span>${esc(x.addr)}</span><span>${esc(x.cat)}</span><span>ZSR/K-Nr. ${esc(x.zsr)}</span>`;e.s.innerHTML=x.specs.map(sp=>`<label class="chip"><input type="checkbox" value="${esc(sp)}" ${st.specs.includes(sp)?'checked':''}> <span>${esc(sp)}</span><em>${beds().filter(b=>b.specialty===sp).length}</em></label>`).join('');e.s.querySelectorAll('input').forEach(i=>i.onchange=()=>{st.specs=i.checked?[...new Set([...st.specs,i.value])]:st.specs.filter(x=>x!==i.value);renderBeds()});e.ns.innerHTML=x.specs.map(s=>`<option>${esc(s)}</option>`).join('');e.ctx.textContent=`${x.name} · ${st.specs.length||'keine'} Fachgebiete`;renderBeds()}function visible(){let a=beds();if(st.specs.length)a=a.filter(b=>st.specs.includes(b.specialty));if(st.status!=='all')a=a.filter(b=>b.status===st.status);if(st.prop!=='all')a=a.filter(b=>b[st.prop]);if(st.q)a=a.filter(b=>[b.specialty,b.station,b.room,b.bed,b.type,b.care,b.notes].join(' ').toLowerCase().includes(st.q));return a}function renderBeds(){let all=beds(),v=visible(),free=all.filter(b=>b.status==='free').length,occ=all.filter(b=>b.status==='occupied').length,usable=all.filter(b=>!['blocked','cleaning'].includes(b.status)).length,util=usable?Math.round(occ/usable*100):0;e.met.innerHTML=[['Betten total',all.length,'im Spital'],['Frei',free,'verfügbar'],['Auslastung',util+'%','nutzbare Betten'],['Ansicht',v.length,'sichtbar']].map(x=>`<article class="metric"><span>${x[0]}</span><strong>${x[1]}</strong><small>${x[2]}</small></article>`).join('');e.o.innerHTML=S.map(s=>{let c=all.filter(b=>b.status===s[0]).length,p=all.length?Math.round(c/all.length*100):0;return`<button class="row" data-f="${s[0]}"><span class="dot ${s[0]}"></span><span>${s[1]}</span><strong>${c}</strong><span class="bar"><i style="width:${p}%"></i></span></button>`}).join('');e.o.querySelectorAll('button').forEach(b=>b.onclick=()=>{st.status=b.dataset.f;e.sf.value=st.status;renderBeds()});e.b.innerHTML=v.length?v.map(card).join(''):'<section class="empty"><strong>Keine Betten in dieser Ansicht</strong><p>Wähle mindestens ein Fachgebiet oder entferne aktive Filter.</p></section>';e.b.querySelectorAll('select[data-id]').forEach(x=>x.onchange=()=>upd(x.dataset.id,x.value))}function card(b){let flags=[b.oxygen&&'Sauerstoff',b.monitoring&&'Monitoring',b.isolation&&'Isolation',b.accessible&&'Barrierefrei'].filter(Boolean),s=S.find(x=>x[0]===b.status)||S[0];return`<article class="bed"><div class="head"><div><span class="eyebrow">${esc(b.specialty)}</span><h3>Zimmer ${esc(b.room)} · Bett ${esc(b.bed)}</h3></div><span class="badge ${b.status}">${s[1]}</span></div><dl><div><dt>Station</dt><dd>${esc(b.station)}</dd></div><div><dt>Typ</dt><dd>${esc(b.type)}</dd></div><div><dt>Pflege</dt><dd>${esc(b.care)}</dd></div></dl><div class="flags">${(flags.length?flags:['Standard']).map(f=>`<span class="flag">${f}</span>`).join('')}</div>${b.notes?`<p class="muted">${esc(b.notes)}</p>`:''}<label class="field">Status ändern<select data-id="${b.id}">${S.map(x=>`<option value="${x[0]}" ${x[0]===b.status?'selected':''}>${x[1]} – ${x[2]}</option>`).join('')}</select></label></article>`}function upd(id,status){setBeds(beds().map(b=>b.id===id?{...b,status}:b));toast('Status aktualisiert');renderBeds()}function add(ev){ev.preventDefault();let sp=e.ns.value,typ=e.nt.value,room=e.nr.value.trim()||('N'+Date.now().toString().slice(-4)),b={id:`${st.hid}-${slug(sp)}-${slug(room)}-${Date.now()}`,specialty:sp,station:sp.split(' ')[0]+' Zusatz',room,bed:'A',type:typ,care:'Normalpflege',isolation:typ==='Isolationsbett',oxygen:['Überwachungsbett','Isolationsbett'].includes(typ),monitoring:typ==='Überwachungsbett',accessible:typ==='Barrierefreies Bett',status:'free',notes:e.nn.value.trim()};setBeds([b,...beds()]);st.specs=[...new Set([...st.specs,sp])];e.f.reset();toast('Neues Bett wurde angelegt');render()}function reset(){if(confirm('Status und Zusatzbetten für dieses Spital zurücksetzen?')){st.db[st.hid]=gen(h());save();toast('Spitaldaten zurückgesetzt');render()}}document.addEventListener('DOMContentLoaded',init);
