<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CMCSix · Spitalbettenverwaltung</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wrap">
<section class="hero panel"><div><p class="kicker">CMCSix Hospitals</p><h1>Spitalbettenverwaltung</h1><p>Spital auswählen, vorhandene Fachgebiete filtern und Bettenstatus manuell pflegen.</p><span id="sync" class="sync"><i></i><span>Supabase wird geprüft …</span></span></div><div class="hero-card"><span>SASIS-Stammdaten</span><strong>16</strong><small>Spitalstandorte geladen</small></div></section>
<section class="layout"><aside class="panel"><label class="field">Spital<select id="hospital"></select></label><div id="meta" class="meta"></div><div class="title"><h2>Fachgebiete</h2><div><button id="all" type="button">Alle</button> <button id="none" type="button">Leeren</button></div></div><div id="specs" class="chips"></div><div class="filters"><label class="field">Status<select id="status"></select></label><label class="field">Eigenschaft<select id="prop"><option value="all">Alle Eigenschaften</option><option value="oxygen">Sauerstoff</option><option value="monitoring">Monitoring</option><option value="isolation">Isolation</option><option value="accessible">Barrierefrei</option></select></label><label class="field">Suche<input id="search" type="search" placeholder="Zimmer, Station, Typ, Geschlecht …"></label></div></aside><section class="work"><section id="metrics" class="metrics"></section><section class="split panel"><div><div class="title"><div><p class="kicker">Statussteuerung</p><h2>Bettenübersicht</h2></div><span id="ctx" class="pill"></span></div><div id="overview" class="overview"></div></div><form id="form" class="form"><h2>Bett ergänzen</h2><label class="field">Fachgebiet<select id="newSpec"></select></label><label class="field">Bettentyp<select id="newType"><option>Standardbett</option><option>Überwachungsbett</option><option>Isolationsbett</option><option>Kurzliegerbett</option><option>Barrierefreies Bett</option></select></label><label class="field">Geschlecht<select id="newGender"><option value="unassigned">Nicht festgelegt</option><option value="female">Weiblich</option><option value="male">Männlich</option><option value="diverse">Divers</option></select></label><label class="field">Zimmer<input id="newRoom" placeholder="z.B. 204"></label><label class="field">Notiz<input id="newNote" placeholder="optional"></label><button class="primary">Bett anlegen</button><button id="reset" class="danger" type="button">Spital zurücksetzen</button></form></section><section id="beds" class="grid" aria-live="polite"></section></section></section>
</main><div id="toast" class="toast"></div>
<script src="supabase-config.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="assets/main.js" defer></script>
</body></html>
